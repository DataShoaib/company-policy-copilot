services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hr-rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hr-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: hr-rag-postgres
    environment:
      POSTGRES_DB: hr_policy
      POSTGRES_USER: hr_policy
      POSTGRES_PASSWORD: hr_policy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_policy -d hr_policy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hr-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # override REDIS_URL to point at the redis service by its compose
      # network name, regardless of what .env has for local (non-docker) dev
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+psycopg://hr_policy:hr_policy_dev_password@postgres:5432/hr_policy
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - qdrant_data:/app/data/qdrant
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
