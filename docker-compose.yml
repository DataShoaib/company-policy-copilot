services:
  redis:
    image: redis:7-alpine
    container_name: hr-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hr-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override REDIS_URL to point at the redis service by its compose
      # network name, regardless of what .env has for local (non-docker) dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
